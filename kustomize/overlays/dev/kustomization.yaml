apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dancehub-dev
resources: [../../base]
components: [../../components/network-policies]
patches:
  - target: { kind: Deployment, name: gatewayservice }
    patch: |-
      - {op: replace, path: /spec/replicas, value: 2}
  - target: { kind: Deployment, name: schedulingservice }
    patch: |-
      - {op: replace, path: /spec/replicas, value: 2}
