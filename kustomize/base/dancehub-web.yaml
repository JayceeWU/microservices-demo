---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dancehub
  annotations: { nginx.ingress.kubernetes.io/ssl-redirect: 'true' }
spec:
  rules:
    - host: app.bayareadancehub.com
      http:
        {
          paths:
            [
              {
                path: /,
                pathType: Prefix,
                backend: { service: { name: student-web, port: { number: 80 } } },
              },
            ],
        }
    - host: teacher.bayareadancehub.com
      http:
        {
          paths:
            [
              {
                path: /,
                pathType: Prefix,
                backend: { service: { name: teacher-web, port: { number: 80 } } },
              },
            ],
        }
    - host: admin.bayareadancehub.com
      http:
        {
          paths:
            [
              {
                path: /,
                pathType: Prefix,
                backend: { service: { name: admin-web, port: { number: 80 } } },
              },
            ],
        }
    - host: api.bayareadancehub.com
      http:
        {
          paths:
            [
              {
                path: /,
                pathType: Prefix,
                backend: { service: { name: gatewayservice, port: { number: 80 } } },
              },
            ],
        }
