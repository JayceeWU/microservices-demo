---
apiVersion: v1
kind: Service
metadata: { name: admin-web }
spec: { selector: { app: admin-web }, ports: [{ port: 80, targetPort: 8080 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: admin-web }
spec:
  selector: { matchLabels: { app: admin-web } }
  template:
    metadata: { labels: { app: admin-web } }
    spec:
      containers:
        - name: admin-web
          image: admin-web
          ports: [{ containerPort: 8080 }]
          env:
            - { name: DANCEHUB_API_URL, value: 'http://localhost:8080' }
            - {
                name: DANCEHUB_OIDC_ISSUER,
                value: 'http://localhost:8081/realms/bay-area-dance-hub',
              }
            - { name: DANCEHUB_AUTH_MODE, value: oidc }
            - { name: DANCEHUB_ENVIRONMENT, value: local }
          readinessProbe: { httpGet: { path: /, port: 8080 } }
