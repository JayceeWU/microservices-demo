apiVersion: v1
kind: Service
metadata: { name: student-web }
spec: { selector: { app: student-web }, ports: [{ port: 80, targetPort: 3000 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: student-web }
spec:
  replicas: 2
  selector: { matchLabels: { app: student-web } }
  template:
    metadata: { labels: { app: student-web } }
    spec:
      containers:
        - name: student-web
          image: student-web
          ports: [{ containerPort: 3000 }]
          env:
            - { name: DANCEHUB_API_URL, value: 'http://localhost:8080' }
            - {
                name: DANCEHUB_OIDC_ISSUER,
                value: 'http://localhost:8081/realms/bay-area-dance-hub',
              }
            - { name: DANCEHUB_AUTH_MODE, value: oidc }
            - { name: DANCEHUB_ENVIRONMENT, value: local }
            - { name: AUTH_URL, value: 'http://localhost:3000' }
            - name: AUTH_SECRET
              valueFrom: { secretKeyRef: { name: dancehub-secrets, key: auth-secret } }
            - { name: AUTH_KEYCLOAK_ID, value: student-web }
            - name: AUTH_KEYCLOAK_SECRET
              valueFrom: { secretKeyRef: { name: dancehub-secrets, key: auth-keycloak-secret } }
            - {
                name: KEYCLOAK_PUBLIC_URL,
                value: 'http://localhost:8081/realms/bay-area-dance-hub',
              }
            - {
                name: KEYCLOAK_INTERNAL_URL,
                value: 'http://keycloak:8080/realms/bay-area-dance-hub',
              }
          readinessProbe: { httpGet: { path: /, port: 3000 } }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: teacher-web }
spec: { selector: { app: teacher-web }, ports: [{ port: 80, targetPort: 8080 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: teacher-web }
spec:
