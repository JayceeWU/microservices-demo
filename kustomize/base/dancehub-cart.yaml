apiVersion: v1
kind: Service
metadata: { name: cartservice }
spec:
  {
    selector: { app: cartservice },
    ports:
      [
        { name: grpc, port: 9090, targetPort: 9090 },
        { name: health, port: 8080, targetPort: 8080 },
      ],
  }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: cartservice }
spec:
  replicas: 2
  selector: { matchLabels: { app: cartservice } }
  template:
    metadata: { labels: { app: cartservice } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: cartservice
          image: cartservice
          ports: [{ name: grpc, containerPort: 9090 }, { name: health, containerPort: 8080 }]
          env: [{ name: REDIS_ADDR, value: 'redis-cart:6379' }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources:
            { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
