apiVersion: v1
kind: ConfigMap
metadata: { name: otel-collector-config }
data:
  config.yaml: |-
    receivers:
      otlp: {protocols: {grpc: {endpoint: 0.0.0.0:4317}, http: {endpoint: 0.0.0.0:4318}}}
    processors:
      memory_limiter: {check_interval: 1s, limit_mib: 384}
      batch: {}
    exporters:
      otlp/jaeger: {endpoint: jaeger:4317, tls: {insecure: true}}
      prometheus: {endpoint: 0.0.0.0:8889}
    service:
      pipelines:
        traces: {receivers: [otlp], processors: [memory_limiter,batch], exporters: [otlp/jaeger]}
        metrics: {receivers: [otlp], processors: [memory_limiter,batch], exporters: [prometheus]}
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector }
spec:
  {
    selector: { app: otel-collector },
    ports: [{ name: grpc, port: 4317 }, { name: http, port: 4318 }, { name: metrics, port: 8889 }],
  }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: otel-collector }
spec:
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.155.0
          args: [--config=/etc/otel/config.yaml]
          ports: [{ containerPort: 4317 }, { containerPort: 4318 }, { containerPort: 8889 }]
          volumeMounts: [{ name: config, mountPath: /etc/otel, readOnly: true }]
          resources:
            { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
      volumes: [{ name: config, configMap: { name: otel-collector-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: jaeger }
spec: { selector: { app: jaeger }, ports: [{ name: otlp, port: 4317 }, { name: ui, port: 16686 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: jaeger }
spec:
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata: { labels: { app: jaeger } }
    spec:
      containers:
        - {
            name: jaeger,
            image: jaegertracing/all-in-one:1.68.0,
            ports: [{ containerPort: 4317 }, { containerPort: 16686 }],
            resources:
              { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } },
          }
