apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../infra/keycloak
  - dancehub-infra.yaml
  - dancehub-services.yaml
  - dancehub-web.yaml
  - dancehub-observability.yaml
  - dancehub-cart.yaml
  - dancehub-auxiliary.yaml
  - dancehub-chat.yaml
patches:
  - target:
      kind: Deployment
      name: '^(accountservice|catalogservice|creditservice|schedulingservice|orderservice|payrollservice|paymentservice|recommendationservice|outbox-relay|chatservice|chat-media-worker)$'
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers
        value:
        - name: wait-for-migrations
          image: postgres:17-alpine
          command: [/bin/sh, -ec]
          args:
          - until psql "$DATABASE_ADMIN_URL" -tAc "SELECT version FROM public.local_seed WHERE version='001'" 2>/dev/null | grep -q 001; do sleep 2; done
          env:
          - name: DATABASE_ADMIN_URL
            valueFrom: {secretKeyRef: {name: dancehub-secrets, key: DATABASE_ADMIN_URL}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
  - target:
      kind: Deployment
      name: '^(gatewayservice|accountservice|catalogservice|creditservice|schedulingservice|orderservice|payrollservice|paymentservice|recommendationservice|outbox-relay|payment-order-saga|cartservice|chatservice|chat-media-worker)$'
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: ENVIRONMENT, value: local}
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: OTEL_SERVICE_NAMESPACE, value: bay-area-dance-hub}
  - target:
      kind: Deployment
      name: '^(gatewayservice|accountservice|catalogservice|schedulingservice|orderservice|payrollservice|paymentservice|chatservice|chat-media-worker)$'
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318"}
  - target:
      kind: Deployment
      name: '^(creditservice|cartservice|recommendationservice|outbox-relay|payment-order-saga)$'
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4317"}
  - target:
      kind: Deployment
      name: '^(gatewayservice|accountservice|catalogservice|creditservice|schedulingservice|orderservice|payrollservice|paymentservice|recommendationservice|outbox-relay|payment-order-saga|cartservice|chatservice|chat-media-worker|student-web|teacher-web|admin-web)$'
    patch: |-
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          seccompProfile: {type: RuntimeDefault}
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value: [{name: tmp, mountPath: /tmp}]
      - op: add
        path: /spec/template/spec/volumes
        value: [{name: tmp, emptyDir: {}}]
  - target:
      kind: Deployment
      name: '^(gatewayservice|accountservice|catalogservice|creditservice|schedulingservice|orderservice|payrollservice|paymentservice|recommendationservice|outbox-relay|payment-order-saga|cartservice|chatservice|chat-media-worker|teacher-web|admin-web)$'
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe
        value: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 5}
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 2, failureThreshold: 30}
      - op: add
        path: /spec/template/spec/containers/0/livenessProbe
        value: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 15}
  - target: { kind: Deployment, name: student-web }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe
        value: {httpGet: {path: /, port: 3000}, periodSeconds: 5}
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value: {httpGet: {path: /, port: 3000}, periodSeconds: 2, failureThreshold: 30}
      - op: add
        path: /spec/template/spec/containers/0/livenessProbe
        value: {httpGet: {path: /, port: 3000}, periodSeconds: 15}
  - target:
      kind: Deployment
      name: '^(creditservice)$'
    patch: |-
      - {op: replace, path: /spec/template/spec/securityContext/runAsUser, value: 1654}
      - {op: replace, path: /spec/template/spec/securityContext/runAsGroup, value: 1654}
  - target:
      kind: Deployment
      name: '^(cartservice|student-web)$'
    patch: |-
      - {op: replace, path: /spec/template/spec/securityContext/runAsUser, value: 1000}
      - {op: replace, path: /spec/template/spec/securityContext/runAsGroup, value: 1000}
  - target:
      kind: Deployment
      name: '^(teacher-web|admin-web)$'
    patch: |-
      - {op: replace, path: /spec/template/spec/securityContext/runAsUser, value: 101}
      - {op: replace, path: /spec/template/spec/securityContext/runAsGroup, value: 101}
  - target: { kind: Deployment, name: student-web }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - {name: tmp, mountPath: /tmp}
          - {name: next-cache, mountPath: /app/apps/student-web/.next/cache}
      - op: replace
        path: /spec/template/spec/volumes
        value:
          - {name: tmp, emptyDir: {}}
          - {name: next-cache, emptyDir: {}}
  - target:
      kind: Deployment
      name: '^(otel-collector|jaeger|keycloak)$'
    patch: |-
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          seccompProfile: {type: RuntimeDefault}
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          readOnlyRootFilesystem: true
  - target: { kind: Deployment, name: otel-collector }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: {name: tmp, mountPath: /tmp}
      - op: add
        path: /spec/template/spec/volumes/-
        value: {name: tmp, emptyDir: {}}
  - target: { kind: Deployment, name: jaeger }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value: [{name: tmp, mountPath: /tmp}]
      - op: add
        path: /spec/template/spec/volumes
        value: [{name: tmp, emptyDir: {}}]
  - target: { kind: Deployment, name: keycloak }
    patch: |-
      - {op: replace, path: /spec/template/spec/securityContext/runAsUser, value: 1000}
      - {op: replace, path: /spec/template/spec/securityContext/runAsGroup, value: 1000}
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: {name: tmp, mountPath: /tmp}
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: {name: keycloak-data, mountPath: /opt/keycloak/data}
      - op: add
        path: /spec/template/spec/volumes/-
        value: {name: tmp, emptyDir: {}}
      - op: add
        path: /spec/template/spec/volumes/-
        value: {name: keycloak-data, emptyDir: {}}
