apiVersion: v1
kind: Service
metadata: { name: recommendationservice }
spec:
  {
    selector: { app: recommendationservice },
    ports: [{ name: grpc, port: 9090 }, { name: health, port: 8080 }],
  }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: recommendationservice }
spec:
  selector: { matchLabels: { app: recommendationservice } }
  template:
    metadata: { labels: { app: recommendationservice } }
    spec:
      containers:
        - name: recommendationservice
          image: recommendationservice
          ports: [{ name: grpc, containerPort: 9090 }, { name: health, containerPort: 8080 }]
          env:
            - {
                name: DATABASE_URL,
                valueFrom:
                  { secretKeyRef: { name: dancehub-secrets, key: recommendation-database-url } },
              }
            - {
                name: KAFKA_BOOTSTRAP_SERVERS,
                valueFrom:
                  { configMapKeyRef: { name: dancehub-config, key: kafka-bootstrap-servers } },
              }
          readinessProbe: { httpGet: { path: /healthz, port: 8080 } }
          securityContext:
            { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, runAsNonRoot: true }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: payment-order-saga }
spec:
  selector: { matchLabels: { app: payment-order-saga } }
  template:
    metadata: { labels: { app: payment-order-saga } }
    spec:
      containers:
        - name: payment-order-saga
          image: outbox-relay
          args: [saga.py]
          env:
            - { name: ORDER_SERVICE_ADDR, value: 'orderservice:9090' }
            - {
                name: KAFKA_BOOTSTRAP_SERVERS,
                valueFrom:
                  { configMapKeyRef: { name: dancehub-config, key: kafka-bootstrap-servers } },
              }
          securityContext:
            { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, runAsNonRoot: true }
          resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { cpu: 300m, memory: 256Mi } }
