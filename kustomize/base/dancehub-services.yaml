apiVersion: v1
kind: ConfigMap
metadata: { name: dancehub-config }
data:
  kafka-bootstrap-servers: kafka:29092
---
apiVersion: batch/v1
kind: Job
metadata: { name: dancehub-migrations }
spec:
  backoffLimit: 3
  template:
    metadata: { labels: { app: dancehub-migrations } }
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        {
          runAsNonRoot: true,
          runAsUser: 65532,
          runAsGroup: 65532,
          seccompProfile: { type: RuntimeDefault },
        }
      containers:
        - name: migrations
          image: dancehub-migrations
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: [ALL] },
            }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          envFrom: [{ secretRef: { name: dancehub-secrets } }]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: batch/v1
kind: Job
metadata: { name: dancehub-seed }
spec:
  backoffLimit: 3
  template:
    metadata: { labels: { app: dancehub-seed } }
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        {
          runAsNonRoot: true,
          runAsUser: 65532,
          runAsGroup: 65532,
          seccompProfile: { type: RuntimeDefault },
        }
      containers:
        - name: seed
          image: dancehub-migrations
          command: [/bin/sh, -ec]
          args:
            - until psql "$DATABASE_URL" -tAc "SELECT 1 FROM public.schema_migrations WHERE version='001_baseline.sql'" | grep -q 1; do sleep 2; done; psql "$DATABASE_ADMIN_URL" -v ON_ERROR_STOP=1 -f /seed/local.sql
          envFrom: [{ secretRef: { name: dancehub-secrets } }]
          securityContext:
            {
              allowPrivilegeEscalation: false,
              readOnlyRootFilesystem: true,
              capabilities: { drop: [ALL] },
            }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          resources: { requests: { cpu: 25m, memory: 32Mi }, limits: { cpu: 200m, memory: 128Mi } }
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: gatewayservice }
spec:
  { type: LoadBalancer, selector: { app: gatewayservice }, ports: [{ port: 80, targetPort: 8080 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gatewayservice }
spec:
  replicas: 2
  selector: { matchLabels: { app: gatewayservice } }
  template:
    metadata: { labels: { app: gatewayservice } }
    spec:
      containers:
        - name: gatewayservice
          image: gatewayservice
          ports: [{ containerPort: 8080 }]
          env:
            - { name: ACCOUNT_SERVICE_ADDR, value: 'accountservice:9090' }
            - { name: CATALOG_SERVICE_ADDR, value: 'catalogservice:9090' }
            - { name: SCHEDULING_SERVICE_ADDR, value: 'schedulingservice:9090' }
            - { name: ORDER_SERVICE_ADDR, value: 'orderservice:9090' }
            - { name: PAYROLL_SERVICE_ADDR, value: 'payrollservice:9090' }
            - { name: PAYMENT_SERVICE_ADDR, value: 'paymentservice:9090' }
            - { name: PAYMENT_WEBHOOK_URL, value: 'http://paymentservice:8080/webhooks/stripe' }
            - { name: CREDIT_SERVICE_ADDR, value: 'creditservice:9090' }
            - { name: CART_SERVICE_ADDR, value: 'cartservice:9090' }
            - { name: RECOMMENDATION_SERVICE_ADDR, value: 'recommendationservice:9090' }
            - { name: CHAT_SERVICE_ADDR, value: 'chatservice:9090' }
            - { name: AUTH_MODE, value: oidc }
            - { name: PAYMENT_MODE, value: fake }
            - { name: ENABLE_SIMULATED_PAYMENTS, value: 'true' }
            - { name: OIDC_ISSUER, value: 'http://localhost:8081/realms/bay-area-dance-hub' }
            - {
                name: OIDC_JWKS_URL,
                value: 'http://keycloak:8080/realms/bay-area-dance-hub/protocol/openid-connect/certs',
              }
            - { name: OIDC_AUDIENCE, value: gateway }
            - {
                name: WEB_ORIGINS,
                value: 'http://localhost:3000,http://localhost:4200,http://localhost:5173',
              }
            - { name: OTEL_COLLECTOR_HTTP_URL, value: 'http://otel-collector:4318' }
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 5 }
          securityContext:
            { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true }
          resources: { requests: { cpu: 100m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: accountservice }
spec:
  {
    selector: { app: accountservice },
    ports: [{ name: grpc, port: 9090 }, { name: health, port: 8080 }],
  }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: accountservice }
spec:
  selector: { matchLabels: { app: accountservice } }
  template:
    metadata: { labels: { app: accountservice } }
    spec:
      containers:
        - {
            name: accountservice,
            image: accountservice,
            ports: [{ containerPort: 9090 }, { containerPort: 8080 }],
            env:
              [
                {
                  name: DATABASE_URL,
                  valueFrom:
                    { secretKeyRef: { name: dancehub-secrets, key: account-database-url } },
                },
              ],
            readinessProbe: { httpGet: { path: /healthz, port: 8080 } },
            resources:
              { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 300m, memory: 256Mi } },
          }
---
