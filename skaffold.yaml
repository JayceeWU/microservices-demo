apiVersion: skaffold/v3
kind: Config
metadata:
  name: bay-area-dance-hub
build:
  platforms: ['linux/amd64']
  artifacts:
    - image: dancehub-migrations
      context: database
    - image: gatewayservice
      context: src/dancehub
      docker:
        buildArgs: { SERVICE: gatewayservice }
    - image: accountservice
      context: src/dancehub
      docker:
        buildArgs: { SERVICE: accountservice }
    - image: chatservice
      context: src/dancehub
      docker:
        buildArgs: { SERVICE: chatservice }
    - image: chatmediaworker
      context: src/dancehub
      docker:
        buildArgs: { SERVICE: chatmediaworker }
    - image: catalogservice
      context: src/dancehub
      docker:
        buildArgs: { SERVICE: catalogservice }
    - image: schedulingservice
      context: src/dancehub
      docker:
        buildArgs: { SERVICE: schedulingservice }
    - image: orderservice
      context: src/dancehub
      docker:
        buildArgs: { SERVICE: orderservice }
    - image: payrollservice
      context: src/dancehub
      docker:
        buildArgs: { SERVICE: payrollservice }
    - image: creditservice
      context: src/creditservice
    - image: outbox-relay
      context: src/eventrelay
    - image: recommendationservice
      context: .
      docker:
        dockerfile: src/recommendationservice/Dockerfile
    - image: paymentservice
      context: .
      docker:
        dockerfile: src/paymentservice/Dockerfile
    - image: cartservice
      context: .
      docker:
        dockerfile: src/cartservice/src/Dockerfile
    - image: student-web
      context: .
      docker:
        dockerfile: apps/student-web/Dockerfile
    - image: teacher-web
      context: .
      docker:
        dockerfile: apps/teacher-web/Dockerfile
    - image: admin-web
      context: .
      docker:
        dockerfile: apps/admin-web/Dockerfile
  tagPolicy:
    gitCommit: {}
  local:
    useDockerCLI: true
    useBuildkit: true
manifests:
  kustomize:
    paths:
      - kustomize/overlays/local
deploy:
  kubectl: {}
portForward:
  - { resourceType: service, resourceName: student-web, port: 80, localPort: 3000 }
  - { resourceType: service, resourceName: teacher-web, port: 80, localPort: 4200 }
  - { resourceType: service, resourceName: admin-web, port: 80, localPort: 5173 }
  - { resourceType: service, resourceName: gatewayservice, port: 80, localPort: 8080 }
  - { resourceType: service, resourceName: keycloak, port: 8080, localPort: 8081 }
  - { resourceType: service, resourceName: minio, port: 9000, localPort: 9000 }
