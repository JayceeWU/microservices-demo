{{- /*
One ServiceAccount per workload. Pods never mount the API token (automountServiceAccountToken
is false everywhere); the account exists so the service mesh can issue each workload its own
SPIFFE identity and AuthorizationPolicy can name callers precisely.

The migration ServiceAccount is a pre-install/pre-upgrade hook with a lower weight than the
migration Job: hooks run before ordinary chart resources exist, so on a first install into an
empty namespace the Job would otherwise reference an account that has not been created yet.
Helm does not delete hook resources on uninstall; `before-hook-creation` recreates it on the
next install or upgrade.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dancehub-migrations
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: dancehub-migrations
    app.kubernetes.io/part-of: bay-area-dance-hub
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: '-5'
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
{{- $names := list -}}
{{- range $name, $_ := .Values.dancehub.services }}{{ $names = append $names $name }}{{ end -}}
{{- range $name, $_ := .Values.dancehub.workers }}{{ $names = append $names $name }}{{ end -}}
{{- range $name := $names }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: bay-area-dance-hub
automountServiceAccountToken: false
{{- end }}
