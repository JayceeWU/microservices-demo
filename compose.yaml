name: bay-area-dance-hub

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [dancehub]

x-app-security: &app-security
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]

x-go-health: &go-health
  healthcheck:
    test: ['CMD', '/healthcheck']
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 5s

x-node-health: &node-health
  healthcheck:
    test:
      [
        'CMD',
        'node',
        '-e',
        "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 5s

x-python-health: &python-health
  healthcheck:
    test:
      [
        'CMD',
        'python',
        '-c',
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)",
      ]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 5s

x-nginx-health: &nginx-health
  healthcheck:
    test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 5s

x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_SERVICE_NAMESPACE: bay-area-dance-hub
  ENVIRONMENT: local

services:
  postgres:
    profiles: [infra, core, full]
    <<: *service-defaults
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dancehub
      POSTGRES_USER: dancehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dancehub-dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dancehub -d dancehub']
      interval: 5s
      timeout: 3s
      retries: 20

  migrations:
    profiles: [infra, core, full]
    <<: [*service-defaults, *app-security]
    restart: 'no'
    build: ./database
    environment:
      DATABASE_ADMIN_URL: postgres://dancehub:${POSTGRES_PASSWORD:-dancehub-dev}@postgres:5432/dancehub?sslmode=disable
      DATABASE_URL: postgres://dancehub_migrator:${DATABASE_MIGRATOR_PASSWORD:-dancehub-migrator-dev}@postgres:5432/dancehub?sslmode=disable
      DATABASE_MIGRATOR_PASSWORD: ${DATABASE_MIGRATOR_PASSWORD:-dancehub-migrator-dev}
      ACCOUNT_DB_PASSWORD: ${ACCOUNT_DB_PASSWORD:-dancehub-account-dev}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-dancehub-catalog-dev}
      SCHEDULING_DB_PASSWORD: ${SCHEDULING_DB_PASSWORD:-dancehub-scheduling-dev}
      CREDIT_DB_PASSWORD: ${CREDIT_DB_PASSWORD:-dancehub-credit-dev}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:-dancehub-orders-dev}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-dancehub-payment-dev}
      PAYROLL_DB_PASSWORD: ${PAYROLL_DB_PASSWORD:-dancehub-payroll-dev}
      RECOMMENDATION_DB_PASSWORD: ${RECOMMENDATION_DB_PASSWORD:-dancehub-recommendation-dev}
      OUTBOX_DB_PASSWORD: ${OUTBOX_DB_PASSWORD:-dancehub-outbox-dev}
      PROJECTION_DB_PASSWORD: ${PROJECTION_DB_PASSWORD:-dancehub-projection-dev}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-dancehub-keycloak-dev}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:-dancehub-chat-dev}
      CHAT_RELAY_DB_PASSWORD: ${CHAT_RELAY_DB_PASSWORD:-dancehub-chat-relay-dev}
      CHAT_MEDIA_DB_PASSWORD: ${CHAT_MEDIA_DB_PASSWORD:-dancehub-chat-media-dev}
    depends_on:
      postgres: { condition: service_healthy }

  seed:
    profiles: [infra, core, full]
    <<: [*service-defaults, *app-security]
    restart: 'no'
    build: ./database
    entrypoint: [psql]
    command: ['--set', 'ON_ERROR_STOP=1', '--file', '/seed/local.sql']
    environment:
      PGHOST: postgres
      PGDATABASE: dancehub
      PGUSER: dancehub
      PGPASSWORD: ${POSTGRES_PASSWORD:-dancehub-dev}
    depends_on:
      migrations: { condition: service_completed_successfully }

  redis-cart:
    profiles: [infra, core, full]
    <<: *service-defaults
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['redis-cart-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  redis-flashsale:
    profiles: [infra, core, full]
    <<: *service-defaults
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['6380:6379']
    volumes: ['redis-flashsale-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  redis-chat:
    profiles: [infra, core, full]
    <<: *service-defaults
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'allkeys-lru']
    ports: ['6381:6379']
    volumes: ['redis-chat-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  cartservice:
    profiles: [core, full]
    <<: [*service-defaults, *app-security]
    build:
      context: .
      dockerfile: src/cartservice/src/Dockerfile
    environment:
      REDIS_ADDR: redis-cart:6379
      <<: *otel-env
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      redis-cart: { condition: service_healthy }
    healthcheck:
      test: ['CMD', '/app/cartservice', '--healthcheck']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  kafka:
    profiles: [infra, core, full]
    <<: *service-defaults
    image: apache/kafka:4.0.0
    ports: ['9092:9092']
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes: ['kafka-data:/var/lib/kafka/data']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka-init:
    profiles: [infra, core, full]
    image: apache/kafka:4.0.0
    networks: [dancehub]
    depends_on:
      kafka:
        condition: service_healthy
    restart: 'no'
    command:
      - /bin/sh
      - -ec
      - |
        for topic in scheduling.events.v1 payment.events.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$${topic}" --partitions 3 --replication-factor 1
        done

  rabbitmq:
    profiles: [infra, core, full]
    <<: *service-defaults
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dancehub}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dancehub-dev}
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes: ['rabbitmq-data:/var/lib/rabbitmq']
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 20

  keycloak:
    profiles: [infra, core, full]
    <<: *service-defaults
    image: quay.io/keycloak/keycloak:26.3
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        /opt/keycloak/bin/kc.sh import --file /opt/keycloak/data/import/realm.json --override true
        exec /opt/keycloak/bin/kc.sh start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/dancehub?currentSchema=keycloak
      KC_DB_USERNAME: keycloak_runtime
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-dancehub-keycloak-dev}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin-dev}
      KC_HEALTH_ENABLED: 'true'
      KC_HOSTNAME: http://localhost:8081
    ports: ['8081:8080']
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          IFS= read -r status <&3;
          [[ "$$status" == *' 200 '* ]]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 180s
    volumes:
      - ./infra/keycloak/realm.local.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      seed:
        condition: service_completed_successfully

  minio:
    profiles: [infra, core, full]
    <<: *service-defaults
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dancehub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dancehub-dev-password}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000,http://localhost:4200,http://localhost:5173
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes: ['minio-data:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  clamav:
    profiles: [infra, core, full]
    <<: *service-defaults
    image: clamav/clamav:1.4
    expose: ['3310']
    healthcheck:
      test: ['CMD-SHELL', 'echo PING | nc 127.0.0.1 3310 | grep PONG']
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s

  jaeger:
    profiles: [infra, core, full]
    <<: *service-defaults
    build:
      context: .
      dockerfile: infra/observability/jaeger.Dockerfile
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports: ['16686:16686']
    healthcheck:
      test: ['CMD', '/busybox', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:14269/']
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    profiles: [infra, core, full]
    <<: *service-defaults
    build:
      context: .
      dockerfile: infra/observability/otel-collector.Dockerfile
    command: ['--config=/etc/otelcol/config.yaml']
    volumes:
      - ./infra/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports: ['4317:4317', '4318:4318']
    depends_on:
      jaeger: { condition: service_healthy }
    healthcheck:
      test: ['CMD', '/busybox', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:13133/']
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    profiles: [infra, core, full]
    <<: *service-defaults
    build:
      context: .
      dockerfile: infra/observability/prometheus.Dockerfile
    command: ['--config.file=/etc/prometheus/prometheus.yaml']
    volumes:
      - ./infra/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    ports: ['9090:9090']
    depends_on:
      otel-collector: { condition: service_healthy }
    healthcheck:
      test: ['CMD', '/busybox', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 20

  accountservice:
    profiles: [core, full]
    <<: [*service-defaults, *app-security, *go-health]
    build:
      context: ./src/dancehub
      args: { SERVICE: accountservice }
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://account_runtime:${ACCOUNT_DB_PASSWORD:-dancehub-account-dev}@postgres:5432/dancehub?sslmode=disable
    depends_on:
      seed: { condition: service_completed_successfully }

  catalogservice:
    profiles: [core, full]
    <<: [*service-defaults, *app-security, *go-health]
    build:
      context: ./src/dancehub
      args: { SERVICE: catalogservice }
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://catalog_runtime:${CATALOG_DB_PASSWORD:-dancehub-catalog-dev}@postgres:5432/dancehub?sslmode=disable
    depends_on:
      seed: { condition: service_completed_successfully }

  creditservice:
    profiles: [core, full]
    <<: [*service-defaults, *app-security]
    build: ./src/creditservice
    environment:
      <<: *otel-env
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      DATABASE_URL: Host=postgres;Port=5432;Database=dancehub;Username=credit_runtime;Password=${CREDIT_DB_PASSWORD:-dancehub-credit-dev}
    depends_on:
      seed: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD', 'dotnet', 'creditservice.dll', '--healthcheck']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  schedulingservice:
    profiles: [core, full]
    <<: [*service-defaults, *app-security, *go-health]
    build:
      context: ./src/dancehub
      args: { SERVICE: schedulingservice }
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://scheduling_runtime:${SCHEDULING_DB_PASSWORD:-dancehub-scheduling-dev}@postgres:5432/dancehub?sslmode=disable
      CREDIT_SERVICE_ADDR: creditservice:9090
      CATALOG_SERVICE_ADDR: catalogservice:9090
    depends_on:
      seed: { condition: service_completed_successfully }
      creditservice: { condition: service_healthy }

  orderservice:
    profiles: [core, full]
    <<: [*service-defaults, *app-security, *go-health]
    build:
      context: ./src/dancehub
      args: { SERVICE: orderservice }
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://orders_runtime:${ORDERS_DB_PASSWORD:-dancehub-orders-dev}@postgres:5432/dancehub?sslmode=disable
      FLASHSALE_REDIS_ADDR: redis-flashsale:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-dancehub}:${RABBITMQ_PASSWORD:-dancehub-dev}@rabbitmq:5672/
      CREDIT_SERVICE_ADDR: creditservice:9090
      SCHEDULING_SERVICE_ADDR: schedulingservice:9090
      CATALOG_SERVICE_ADDR: catalogservice:9090
      PAYMENT_SERVICE_ADDR: paymentservice:9090
    depends_on:
      seed: { condition: service_completed_successfully }
      redis-flashsale: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      creditservice: { condition: service_healthy }
      schedulingservice: { condition: service_healthy }
      paymentservice: { condition: service_healthy }

  payrollservice:
    profiles: [core, full]
    <<: [*service-defaults, *app-security, *go-health]
    build:
      context: ./src/dancehub
      args: { SERVICE: payrollservice }
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://payroll_runtime:${PAYROLL_DB_PASSWORD:-dancehub-payroll-dev}@postgres:5432/dancehub?sslmode=disable
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      seed: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }

  paymentservice:
    profiles: [core, full]
    <<: [*service-defaults, *app-security, *node-health]
    build:
      context: .
      dockerfile: src/paymentservice/Dockerfile
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://payment_runtime:${PAYMENT_DB_PASSWORD:-dancehub-payment-dev}@postgres:5432/dancehub?sslmode=disable
      PAYMENT_MODE: ${PAYMENT_MODE:-fake}
      ENABLE_SIMULATED_PAYMENTS: ${ENABLE_SIMULATED_PAYMENTS:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      seed: { condition: service_completed_successfully }

  recommendationservice:
    profiles: [core, full]
    <<: [*service-defaults, *app-security, *python-health]
    build:
      context: .
      dockerfile: src/recommendationservice/Dockerfile
    environment:
      <<: *otel-env
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      DATABASE_URL: postgres://recommendation_runtime:${RECOMMENDATION_DB_PASSWORD:-dancehub-recommendation-dev}@postgres:5432/dancehub?sslmode=disable
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      seed: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  chatservice:
    profiles: [core, full]
    <<: [*service-defaults, *app-security, *go-health]
    build:
      context: ./src/dancehub
      args: { SERVICE: chatservice }
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://chat_runtime:${CHAT_DB_PASSWORD:-dancehub-chat-dev}@postgres:5432/dancehub?sslmode=disable
      CHAT_RELAY_DATABASE_URL: postgres://chat_relay:${CHAT_RELAY_DB_PASSWORD:-dancehub-chat-relay-dev}@postgres:5432/dancehub?sslmode=disable
      CHAT_REDIS_ADDR: redis-chat:6379
      ACCOUNT_SERVICE_ADDR: accountservice:9090
      CATALOG_SERVICE_ADDR: catalogservice:9090
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-dancehub}:${RABBITMQ_PASSWORD:-dancehub-dev}@rabbitmq:5672/
      OBJECT_STORAGE_ENDPOINT: minio:9000
      OBJECT_STORAGE_PUBLIC_ENDPOINT: localhost:9000
      OBJECT_STORAGE_SECURE: 'false'
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-dancehub}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dancehub-dev-password}
      CHAT_MEDIA_BUCKET: dancehub-chat
    depends_on:
      seed: { condition: service_completed_successfully }
      redis-chat: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
      accountservice: { condition: service_healthy }
      catalogservice: { condition: service_healthy }

  chat-media-worker:
    profiles: [core, full]
    <<: [*service-defaults, *app-security, *go-health]
    build:
      context: ./src/dancehub
      args: { SERVICE: chatmediaworker }
    environment:
      <<: *otel-env
      DATABASE_URL: postgres://chat_media_worker:${CHAT_MEDIA_DB_PASSWORD:-dancehub-chat-media-dev}@postgres:5432/dancehub?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-dancehub}:${RABBITMQ_PASSWORD:-dancehub-dev}@rabbitmq:5672/
      OBJECT_STORAGE_ENDPOINT: minio:9000
      OBJECT_STORAGE_SECURE: 'false'
      OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-dancehub}
      OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dancehub-dev-password}
      CHAT_MEDIA_BUCKET: dancehub-chat
      CLAMAV_ADDR: clamav:3310
    depends_on:
      seed: { condition: service_completed_successfully }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
      clamav: { condition: service_healthy }

  gatewayservice:
    profiles: [core, full]
    <<: [*service-defaults, *app-security, *go-health]
    build:
      context: ./src/dancehub
      args: { SERVICE: gatewayservice }
    environment:
      <<: *otel-env
      ACCOUNT_SERVICE_ADDR: accountservice:9090
      CATALOG_SERVICE_ADDR: catalogservice:9090
      SCHEDULING_SERVICE_ADDR: schedulingservice:9090
      ORDER_SERVICE_ADDR: orderservice:9090
      PAYROLL_SERVICE_ADDR: payrollservice:9090
      PAYMENT_SERVICE_ADDR: paymentservice:9090
      RECOMMENDATION_SERVICE_ADDR: recommendationservice:9090
      PAYMENT_WEBHOOK_URL: http://paymentservice:8080/webhooks/stripe
      CREDIT_SERVICE_ADDR: creditservice:9090
      CART_SERVICE_ADDR: cartservice:9090
      CHAT_SERVICE_ADDR: chatservice:9090
      OTEL_COLLECTOR_HTTP_URL: http://otel-collector:4318
      AUTH_MODE: ${AUTH_MODE:-oidc}
      PAYMENT_MODE: ${PAYMENT_MODE:-fake}
      ENABLE_SIMULATED_PAYMENTS: ${ENABLE_SIMULATED_PAYMENTS:-true}
      OIDC_ISSUER: http://localhost:8081/realms/bay-area-dance-hub
      OIDC_JWKS_URL: http://keycloak:8080/realms/bay-area-dance-hub/protocol/openid-connect/certs
      OIDC_AUDIENCE: gateway
      WEB_ORIGINS: http://localhost:3000,http://localhost:4200,http://localhost:5173
    ports: ['8080:8080']
    depends_on:
      accountservice: { condition: service_healthy }
      catalogservice: { condition: service_healthy }
      schedulingservice: { condition: service_healthy }
      orderservice: { condition: service_healthy }
      payrollservice: { condition: service_healthy }
      paymentservice: { condition: service_healthy }
      recommendationservice: { condition: service_healthy }
      cartservice: { condition: service_healthy }
      chatservice: { condition: service_healthy }

  student-web:
    profiles: [full]
    <<: [*service-defaults, *app-security, *node-health]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    build:
      context: .
      dockerfile: apps/student-web/Dockerfile
    environment:
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET:-dancehub-local-auth-secret-change-me-32chars}
      AUTH_KEYCLOAK_ID: student-web
      AUTH_KEYCLOAK_SECRET: ${AUTH_KEYCLOAK_SECRET:-student-web-local-secret}
      KEYCLOAK_PUBLIC_URL: http://localhost:8081/realms/bay-area-dance-hub
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/bay-area-dance-hub
      DANCEHUB_API_URL: http://localhost:8080
      DANCEHUB_OIDC_ISSUER: http://localhost:8081/realms/bay-area-dance-hub
      DANCEHUB_AUTH_MODE: ${AUTH_MODE:-oidc}
      DANCEHUB_ENVIRONMENT: local
    ports: ['3000:3000']
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/apps/student-web/.next/cache:rw,noexec,nosuid,size=128m
    depends_on:
      gatewayservice: { condition: service_healthy }
      keycloak: { condition: service_started }

  teacher-web:
    profiles: [full]
    <<: [*service-defaults, *app-security, *nginx-health]
    build:
      context: .
      dockerfile: apps/teacher-web/Dockerfile
    environment:
      DANCEHUB_API_URL: http://localhost:8080
      DANCEHUB_OIDC_ISSUER: http://localhost:8081/realms/bay-area-dance-hub
      DANCEHUB_AUTH_MODE: ${AUTH_MODE:-oidc}
      DANCEHUB_ENVIRONMENT: local
    ports: ['4200:8080']
    depends_on:
      gatewayservice: { condition: service_healthy }

  admin-web:
    profiles: [full]
    <<: [*service-defaults, *app-security, *nginx-health]
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
    environment:
      DANCEHUB_API_URL: http://localhost:8080
      DANCEHUB_OIDC_ISSUER: http://localhost:8081/realms/bay-area-dance-hub
      DANCEHUB_AUTH_MODE: ${AUTH_MODE:-oidc}
      DANCEHUB_ENVIRONMENT: local
    ports: ['5173:8080']
    depends_on:
      gatewayservice: { condition: service_healthy }

  outbox-relay:
    profiles: [full]
    <<: [*service-defaults, *app-security, *python-health]
    build: ./src/eventrelay
    command: [relay.py]
    environment:
      <<: *otel-env
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      DATABASE_URL: postgres://outbox_worker:${OUTBOX_DB_PASSWORD:-dancehub-outbox-dev}@postgres:5432/dancehub?sslmode=disable
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      seed: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  payment-order-saga:
    profiles: [full]
    <<: [*service-defaults, *app-security, *python-health]
    build: ./src/eventrelay
    command: [saga.py]
    environment:
      <<: *otel-env
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ORDER_SERVICE_ADDR: orderservice:9090
    depends_on:
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      orderservice: { condition: service_healthy }

networks:
  dancehub:

volumes:
  postgres-data:
  redis-cart-data:
  redis-flashsale-data:
  redis-chat-data:
  kafka-data:
  rabbitmq-data:
  minio-data:
